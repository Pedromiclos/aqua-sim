<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Simulação - AquaSim</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="app">

    <aside class="sidebar">
        <h2>💧 AquaSim</h2>
        <p>Simulador de Consumo<br>de Água Residencial</p>

        <a href="index.html">🏠 Início</a>
        <a class="active" href="/simulacao">☑ Simulações</a>
        <a href="#">🛡 Dicas de Economia</a>
        <a href="#">📄 Relatórios</a>

        <div class="config">⚙ Configurações</div>
    </aside>

    <main class="main">

        <div class="steps">
            <div><span>1</span><strong>Boas-vindas</strong></div>
            <div><span>2</span><strong>Coleta de informações</strong></div>
            <div><span>3</span><strong>Resultado</strong></div>
        </div>

        <section class="form-card">

            <h1>Sobre sua residência</h1>

            <p class="sub">
                Estas informações ajudam a tornar sua simulação mais precisa.
            </p>

            <form action="/resultado" method="POST">

                <div class="grid-form">

                    <div>
                        <label>Tipo de residência</label>
                        <select>
                            <option>Casa</option>
                            <option>Apartamento</option>
                        </select>
                    </div>

                    <div>
                        <label>Quantas pessoas moram?</label>
                        <input type="number" name="pessoas" required>
                    </div>

                    <div>
                        <label>Área construída (m²)</label>
                        <input type="number" name="area" required>
                    </div>

                    <div>
                        <label>Banhos por dia</label>
                        <input type="number" name="banhos" required>
                    </div>

                </div>

                <div class="acoes">
                    <a href="/" class="voltar">Voltar</a>
                    <button type="submit">Continuar →</button>
                </div>

            </form>

        </section>

    </main>

</div>

</body>
</html>
